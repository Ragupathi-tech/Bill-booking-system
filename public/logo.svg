<svg width="400" height="100" viewBox="0 0 400 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#f59e0b" />
      <stop offset="100%" stopColor="#ea580c" />
    </linearGradient>
    <linearGradient id="bgCircle" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#1e293b" />
      <stop offset="100%" stopColor="#0f172a" />
    </linearGradient>
  </defs>

  <!-- Emblem Icon -->
  <g transform="translate(10, 5)">
    <circle cx="45" cy="45" r="42" fill="url(#bgCircle)" stroke="url(#logoGrad)" stroke-width="3" />
    <circle cx="45" cy="45" r="36" stroke="#f59e0b" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />
    
    <!-- Chef Toque & Cloche -->
    <path d="M30 56h30c2 0 3-1 3-3 0-7-5-12-9-14 2-2 2-6 0-9-3-3-6-4-8-4-2 0-5 1-8 4-2 3-2 7 0 9-4 2-9 7-9 14 0 2 1 3 3 3z" fill="url(#logoGrad)" />
    <rect x="28" y="60" width="34" height="3" rx="1.5" fill="#ffffff" />
    <circle cx="45" cy="20" r="3" fill="#f59e0b" />
  </g>

  <!-- Typography -->
  <g transform="translate(110, 20)">
    <text x="0" y="36" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#ffffff" letter-spacing="2">
      SUSHI <tspan fill="#f59e0b">HOTEL</tspan>
    </text>
    <text x="2" y="56" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="12" fill="#94a3b8" letter-spacing="3">
      PADALUR • OOTTATHUR ROAD
    </text>
  </g>
</svg>
